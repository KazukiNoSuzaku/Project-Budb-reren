[project]
name = "budbaereren"
version = "0.1.0"
description = "Budbæreren: a self-pruning neural network built from scratch in NumPy"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Kaustav Ghosh" }]
dependencies = [
    "numpy>=1.26",
    "matplotlib>=3.8",
    # Used ONLY to download MNIST (sklearn.datasets.fetch_openml). Never for models or gradients.
    "scikit-learn>=1.4",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["budbaereren"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: tests that train a network for more than a few seconds"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
